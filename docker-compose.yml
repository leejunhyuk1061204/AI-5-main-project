# =========================================================================
# 🚀 AI-5 Car-Sentry 원클릭 인프라 서비스
# =========================================================================
# 💡 [필독] RabbitMQ 에러 시 조치방법 (PRECONDITION_FAILED)
#
# 큐 설정이 변경되어 기존 큐와 충돌이 발생할 경우, 아래 명령어로 큐를 삭제하고 재실행하세요.
# docker exec car-sentry-mq rabbitmqctl delete_queue ai.diagnosis.queue
#
# (기본 실행: docker-compose up -d)
# =========================================================================

services:
  # 1. 데이터베이스 (PostgreSQL + TimescaleDB + pgvector)
  db:
    image: timescale/timescaledb-ha:pg15
    container_name: car-sentry-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-car_sentry}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres_1024:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - ./db/seed_car_models.sql:/docker-entrypoint-initdb.d/03_seed_car_models.sql
      - ./db/seed_dtc_data.sql:/docker-entrypoint-initdb.d/04_seed_dtc_codes.sql
    networks:
      - car-sentry-network

  # 2. 메시지 큐 (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: car-sentry-mq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${MQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${MQ_PASSWORD:-guest}
    ports:
      - "${MQ_PORT:-5672}:5672" # AMQP 포트
      - "${MQ_MANAGEMENT_PORT:-15672}:15672" # Management UI 포트
    networks:
      - car-sentry-network

networks:
  car-sentry-network:
    driver: bridge

volumes:
  postgres_data:
