# OBD 에뮬레이터 설정 파일

# 연결 설정 (단일 포트 사용)
connection:
  port: "COM3"
  baudrate: 38400

# 차량 프로필 설정 (3대)
vehicles:
  - id: "DEV_001"
    name: "YF Sonata"
    vin: "1HMXOBSGK693TJ7JR"
    csv_file: "scenarios/driving_normal.csv"
    mappings: # PID: {column: "CSV_COL_NAME", formula: "EXPRESSION"}
      "010C": { col: "rpm", formula: "x * 4" }       # RPM
      "010D": { col: "speed", formula: "x" }         # Speed
      "0105": { col: "temp", formula: "x + 40" }     # Coolant Temp
      "0104": { col: "load", formula: "x * 2.55" }   # Engine Load (0-100% -> 0-255)
      "0142": { col: "voltage", formula: "x * 1000"} # Voltage (V -> mV)
    dtcs: ["P0115", "P0300"] # 초기 고장코드

  - id: "DEV_002"
    name: "K5 Hybrid"
    vin: "KNAKU411B56382911"
    csv_file: "scenarios/driving_traffic.csv"
    mappings:
      "010C": { col: "rpm", formula: "x * 4" }
      "010D": { col: "speed", formula: "x" }
      "0105": { col: "temp", formula: "x + 40" }
      "0142": { col: "batt_volt", formula: "x * 1000"}
    dtcs: []

  - id: "DEV_003"
    name: "Genesis G80"
    vin: "KMHGN41EBJU183921"
    csv_file: "scenarios/fault_scenario.csv"
    mappings:
      "010C": { col: "rpm", formula: "x * 4" }
      "010D": { col: "speed", formula: "x" }
      "0105": { col: "temp", formula: "x + 40" }
      "0104": { col: "load", formula: "x * 2.55" }
      "0142": { col: "voltage", formula: "x * 1000"}
      "0111": { col: "throttle", formula: "x * 2.55"}
    dtcs: ["P0011"]

# 공통 설정
replay:
  interval: 0.5
  loop: true
