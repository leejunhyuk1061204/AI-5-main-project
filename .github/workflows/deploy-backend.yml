name: Deploy Backend

on:
  push:
    branches: [deploy, main]

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Firebase Service Account file
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > backend/firebase-service-account.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        working-directory: backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-5-backend:${{ github.ref_name }} .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-5-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-5-backend:${{ github.ref_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-5-backend:latest

      - name: Create Firebase Service Account file
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > backend/firebase-service-account.json

      - name: Copy Firebase Config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/firebase-service-account.json"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-5-backend:latest
            
            # --- 1. PostgreSQL ---
            if [ ! "$(sudo docker ps -q -f name=ai-5-db)" ]; then
                if [ "$(sudo docker ps -aq -f status=exited -f name=ai-5-db)" ]; then
                    echo "🔄 Starting existing PostgreSQL container..."
                    sudo docker start ai-5-db
                else
                    echo "🐘 Running new PostgreSQL container..."
                    sudo docker run -d --name ai-5-db --restart unless-stopped --network host -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=car_sentry postgres:15
                fi
            fi

            # --- 2. Redis ---
            if [ ! "$(sudo docker ps -q -f name=ai-5-redis)" ]; then
                if [ "$(sudo docker ps -aq -f status=exited -f name=ai-5-redis)" ]; then
                    echo "🔄 Starting existing Redis container..."
                    sudo docker start ai-5-redis
                else
                    echo "🔺 Running new Redis container..."
                    sudo docker run -d --name ai-5-redis --restart unless-stopped --network host redis:alpine
                fi
            fi

            # --- 3. RabbitMQ ---
            if [ ! "$(sudo docker ps -q -f name=ai-5-mq)" ]; then
                if [ "$(sudo docker ps -aq -f status=exited -f name=ai-5-mq)" ]; then
                    echo "🔄 Starting existing RabbitMQ container..."
                    sudo docker start ai-5-mq
                else
                    echo "🐰 Running new RabbitMQ container..."
                    sudo docker run -d --name ai-5-mq --restart unless-stopped --network host -e RABBITMQ_DEFAULT_USER=guest -e RABBITMQ_DEFAULT_PASS=guest rabbitmq:3-management
                fi
            fi
            
            # --- 4. Backend ---
            echo "⏹️ Stopping existing backend container..."
            sudo docker stop ai-5-backend || true
            sudo docker rm ai-5-backend || true
            
            REMOTE_ENV_PATH="/home/ubuntu/.env"
            FIREBASE_MOUNT=""
            if [ -f "/home/ubuntu/firebase-service-account.json" ]; then
                FIREBASE_MOUNT="-v /home/ubuntu/firebase-service-account.json:/app/firebase-service-account.json"
                echo "🔥 Firebase config found. Mounting..."
            fi
            
            echo "▶️ Running new backend container..."
            if [ -f "$REMOTE_ENV_PATH" ]; then
              sudo docker run -d \
                --name ai-5-backend \
                --restart unless-stopped \
                --network host \
                --env-file $REMOTE_ENV_PATH \
                $FIREBASE_MOUNT \
                ${{ secrets.DOCKERHUB_USERNAME }}/ai-5-backend:latest
            else
              echo "⚠️ Warning: .env file not found. Running without env file."
              sudo docker run -d \
                --name ai-5-backend \
                --restart unless-stopped \
                --network host \
                $FIREBASE_MOUNT \
                ${{ secrets.DOCKERHUB_USERNAME }}/ai-5-backend:latest
            fi
            
            # Clean up old images
            sudo docker image prune -f

      - name: Deployment Complete
        run: |
          echo "✅ Backend deployed successfully!"
          echo "🌐 Server: http://${{ secrets.EC2_HOST }}:8080"
